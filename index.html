<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Fuzzy TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="screen">
      <div id="player"></div>
      <canvas id="fuzz" aria-hidden="true"></canvas>
      <div id="caption" aria-live="polite"></div>
      <div id="bug" aria-hidden="true">FUZZY TV</div>
    </main>
    <button id="tune-in" type="button" hidden>Press to tune in</button>
    <div id="off-air" hidden>Fuzzy TV is off the air. Check back soon.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
